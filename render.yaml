services:
  # ------------------------------------------------------------
  # Frontend — Vite + React 19 Static Site
  # ------------------------------------------------------------
  - type: web
    name: movex-1
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "geolocation=(self), microphone=(), camera=(self), bluetooth=(self)"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"

  # ------------------------------------------------------------
  # Backend — Node 20 + Express Web Service
  # ------------------------------------------------------------
  - type: web
    name: movex-zkgd
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: TINYFISH_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://movex-1.onrender.com
    healthCheckPath: /api/health

databases:
  # ------------------------------------------------------------
  # MongoDB Atlas is external — nothing to declare here.
  # ------------------------------------------------------------